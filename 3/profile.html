<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        body {
            color: #374151;
            font-size: 16px;
            background-color: #F3F4F6;
            margin: 0;
        }

        header {
            background-color: #1E3A5F;
            color: #FFFFFF;
            font-size: 16px;
            padding: 22px;
            margin: 16px;
            border: 2px solid #16304F;

            h1 {
                margin: 0;
                font-size: 32px;
                color: #FFFFFF;
            }

            p {
                margin: 12px 0;
                font-size: 16px;
                color: #DBEAFE;
            }
        }

        main {
            background-color: #FFFFFF;
            color: #374151;
            border: 2px solid #D1D5DB;
            padding: 0px;
            margin: 16px;

            h2 {
                color: #1E3A5F;
                background-color: #E8EEF5;
                font-size: 22px;
                margin: 10px;
                padding: 5px;
                border: 1px solid #D1D5DB;
            }

            section:nth-of-type(1) p{
                margin: 10px;
                padding: 8px;
                font-size: 16px;
                color: #4B5563;
                border: 1px solid #E5E7EB;
            }

            section:nth-of-type(2) p {
                background-color: #DCFCE7;
                border: 1px solid #BBF7D0;
                color: #166534;
                font-size: 16px;
                padding: 12px;
                margin: 10px;
            }

            section:nth-of-type(3) p {
                background-color: #FFF7ED;
                color: #7C2D12;
                padding: 5px;
                margin: 0;
            }

            .goals {
                border: 1px solid #FED7AA;
                margin: 10px;
            }
        }

        footer {
            background-color: #1E3A5F;
            color: #FFFFFF;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #16304F;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Profile</h1>
        <p>Welcome to my personal page!</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>
                Hello! My name is Alex. I am learning web development
                and I enjoy creating simple and beautiful websites.
            </p>
        </section>

        <section>
            <h2>My Skills</h2>
            <p>HTML</p>
            <p>CSS</p>
            <p>JavaScript</p>
        </section>

        <section>
            <h2>My Goals</h2>
            <div class="goals">
                <p>Learn CSS</p>
                <p>Build beautiful websites</p>
                <p>Become a web developer</p>
            </div>
        </section>

        <footer>
            <p>Created by Alex - 2026</p>
        </footer>
    </main>

</body>

</html>
